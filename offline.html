<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Monitor CCTV</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
      font-family: Arial, sans-serif;
      color: #0f172a;
    }
    .card {
      width: min(90vw, 32rem);
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 2rem;
    }
    p {
      margin: 0 0 1.25rem;
      color: #475569;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      padding: .75rem 1.1rem;
      border-radius: .75rem;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Anda sedang offline</h1>
    <p>Halaman ini sudah tersimpan di browser dan bisa dibuka saat koneksi internet tidak tersedia.</p>
    <a href="/pages/login.html">Kembali ke login</a>
  </div>
</body>
</html>
